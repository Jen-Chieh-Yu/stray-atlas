# Build the Vite app and publish it to GitHub Pages. See CLAUDE.md section 3,
# stage 1.
#
# Pages is served from the artifact this workflow uploads, not from a branch,
# so nothing built ever lands in git history. The Pages source must be set to
# "GitHub Actions" in the repository settings once; a workflow file cannot set
# it for you.
name: Deploy Pages

on:
  push:
    branches: [main]
    # The raw archive under data/ is an input to the build scripts, not an
    # asset, so a push that only touches it does not deploy. A push that
    # rebuilds public/data/ by hand does.
    #
    # The daily snapshot bot pushes with GITHUB_TOKEN, and such a push starts
    # no workflow at all. When it rebuilds public/data/ it starts this one
    # through workflow_dispatch instead (see daily-snapshot.yml).
    paths-ignore:
      - "data/**"
      - ".github/workflows/daily-snapshot.yml"
  workflow_dispatch:

# contents: read to check out; pages + id-token for the deployment's OIDC
# handshake. Deliberately narrower than the snapshot workflow: this one has no
# reason to write to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued runs collapse to the newest, but a run
# already deploying is left alone rather than cancelled half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # ci, not install: it installs exactly what package-lock.json pins and
      # fails if the lockfile and package.json disagree, so a deploy can never
      # quietly pick up a different dependency tree than the one tested.
      - name: Install dependencies
        run: npm ci

      # npm run build is vue-tsc --build && vite build, so a type error fails
      # the deploy rather than shipping a broken page.
      # The Maps Embed key ships inside the built page (it is not a secret in
      # the browser; it is restricted to this site's referrers in Google
      # Cloud). Keeping it in a repository secret only keeps it out of the git
      # history. Unset, the shelter page links to Google Maps instead.
      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_MAPS_EMBED_KEY: ${{ secrets.GOOGLE_MAPS_EMBED_KEY }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
