# Daily archive of the source stock snapshot, and the site data rebuilt from
# it. See CLAUDE.md section 3, stage 0, and section 4.1.
#
# This workflow is the project's only source of time-series data: the feed drops
# animals once they leave the shelter, so a day not archived is a day that can
# never be recovered. It is therefore scheduled before anything else is built.
#
# When the day's snapshot is new, the same run rebuilds public/data/ from it and
# asks the Pages workflow to deploy. The archive always comes first: a broken
# rebuild never costs the day's snapshot.
name: Daily snapshot

on:
  schedule:
    # Since 2026-10-22 the source drops connections from outside Taiwan, so the
    # fetch goes out through a Tailscale exit node on a desktop in Taiwan that
    # is on in the evening. The daily run is started by that desktop at 21:00
    # Taipei time (scripts/trigger_snapshot.ps1, a workflow_dispatch): GitHub
    # delays scheduled runs by two to four hours, which in the evening would
    # carry them past midnight, onto the next day's date and past the time the
    # desktop is off. The crons here only cover for it:
    #
    # - 21:17, a backup in case the desktop's trigger did not fire. It fetches
    #   only while it is still 21:00-23:59 in Taipei; a run delayed past
    #   midnight would archive the next day's date at the wrong time of day.
    # - 08:17, the check on the day before (WATCHDOG). The feed is live, so a
    #   missed day cannot be fetched afterwards; this records it as failed,
    #   which also fails the run and sends the notification.
    #
    # Minute 17 avoids the top-of-hour queue.
    #
    # Note: GitHub disables cron workflows in a repository with no activity for
    # 60 days. The daily commit this job makes counts as activity, so the
    # schedule sustains itself as long as it keeps succeeding.
    - cron: "17 13 * * *" # 21:17 Asia/Taipei
    - cron: "17 0 * * *" # 08:17, see WATCHDOG
  workflow_dispatch:
    inputs:
      force:
        description: "Re-download and overwrite today's snapshot"
        type: boolean
        default: false

# contents: write so GITHUB_TOKEN can push the snapshot back to the branch.
# actions: write to start the Pages workflow: a push made with GITHUB_TOKEN does
# not trigger other workflows, but an explicit workflow_dispatch does.
permissions:
  contents: write
  actions: write

# Never let a manual run collide with the scheduled one: both push to the same
# branch. Queue instead of cancelling, so a run in progress still archives.
concurrency:
  group: daily-snapshot
  cancel-in-progress: false

env:
  # The morning cron; must match its cron string exactly.
  WATCHDOG: "17 0 * * *"

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # mode=fetch: archive today. mode=mark-failed: the watchdog found no
      # manifest row for yesterday. mode=none: nothing to do.
      #
      # A day already archived needs nothing more. fetch_snapshot.py skips a
      # day whose file exists, but an "unchanged" day has no file, so read the
      # manifest row instead.
      - name: Decide what this run does
        id: plan
        env:
          FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          status_of() { awk -F, -v d="$1" '$1 == d { print $2 }' data/raw/_manifest.csv; }
          today="$(TZ=Asia/Taipei date +%F)"
          hour="$(TZ=Asia/Taipei date +%H)"
          if [ "${SCHEDULE}" = "${WATCHDOG}" ]; then
            yesterday="$(TZ=Asia/Taipei date -d yesterday +%F)"
            if [ -z "$(status_of "${yesterday}")" ]; then
              echo "mode=mark-failed" >> "${GITHUB_OUTPUT}"
              echo "date=${yesterday}" >> "${GITHUB_OUTPUT}"
            else
              echo "${yesterday} is recorded as $(status_of "${yesterday}")"
              echo "mode=none" >> "${GITHUB_OUTPUT}"
            fi
            exit 0
          fi
          status="$(status_of "${today}")"
          if [ "${FORCE}" != "true" ] && { [ "${status}" = "stored" ] || [ "${status}" = "unchanged" ]; }; then
            echo "${today} is already ${status}, nothing to do"
            echo "mode=none" >> "${GITHUB_OUTPUT}"
          elif [ "${EVENT}" = "schedule" ] && (( 10#${hour} < 21 )); then
            echo "the backup ran at ${hour}:00 Taipei time, outside 21:00-23:59; skipping"
            echo "mode=none" >> "${GITHUB_OUTPUT}"
          else
            echo "mode=fetch" >> "${GITHUB_OUTPUT}"
            echo "date=${today}" >> "${GITHUB_OUTPUT}"
          fi

      # Joins as an ephemeral node, removed once the run ends. The tailnet policy
      # lets tag:ci use the exit node for the internet and reach nothing else.
      - name: Join the tailnet
        if: steps.plan.outputs.mode == 'fetch'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Probe the source through the exit node before the real fetch, so an
      # offline desktop costs seconds rather than the fetch's ten minutes of
      # retries. On failure the exit node is cleared at once: with it set and
      # offline, the push later in the job would have no route either.
      - name: Route through the exit node
        id: route
        if: steps.plan.outputs.mode == 'fetch'
        env:
          EXIT_NODE: ${{ vars.TS_EXIT_NODE }}
          SOURCE_HOST: data.moa.gov.tw
        run: |
          # Resolve the source first: the runner's DNS server may not be
          # reachable once all traffic leaves through the exit node.
          ip="$(getent ahostsv4 "${SOURCE_HOST}" | awk 'NR == 1 { print $1 }')" || true
          if [ -n "${ip}" ]; then
            echo "${ip} ${SOURCE_HOST}" | sudo tee -a /etc/hosts > /dev/null
          fi
          if sudo tailscale set --exit-node="${EXIT_NODE}" \
            && curl -sS -o /dev/null --connect-timeout 20 --max-time 60 "https://${SOURCE_HOST}/"; then
            echo "online=true" >> "${GITHUB_OUTPUT}"
          else
            sudo tailscale set --exit-node= || true
            echo "::notice::exit node ${EXIT_NODE} is offline or cannot reach ${SOURCE_HOST}"
            echo "online=false" >> "${GITHUB_OUTPUT}"
          fi

      # No dependency install step: the script is standard library only, which
      # keeps the daily job immune to package resolution breaking.
      #
      #
      # Without the exit node the backup cron stops quietly, leaving the day to
      # the watchdog. A dispatched run goes ahead and fails as the source blocks
      # the runner, recording the day as failed; a later run that day can still
      # overwrite that row.
      - name: Fetch snapshot
        id: fetch
        if: >-
          steps.plan.outputs.mode == 'mark-failed'
          || (steps.plan.outputs.mode == 'fetch'
            && (steps.route.outputs.online == 'true'
              || github.event_name == 'workflow_dispatch'))
        env:
          # Optional repository variable; the script falls back to the URL
          # published on https://data.gov.tw/dataset/85903 when unset.
          SNAPSHOT_URL: ${{ vars.SNAPSHOT_URL }}
          FORCE: ${{ inputs.force }}
          MODE: ${{ steps.plan.outputs.mode }}
          DATE: ${{ steps.plan.outputs.date }}
        run: |
          if [ "${MODE}" = "mark-failed" ]; then
            python scripts/fetch_snapshot.py --date "${DATE}" \
              --mark-failed "no run archived ${DATE}; was the exit node offline all evening?"
          elif [ "${FORCE}" = "true" ]; then
            python scripts/fetch_snapshot.py --force
          else
            python scripts/fetch_snapshot.py
          fi

      # Everything after the fetch, the push included, goes out directly.
      - name: Leave the exit node
        if: always() && steps.route.outputs.online == 'true'
        run: sudo tailscale set --exit-node=

      # Only a newly stored snapshot is worth rebuilding. "unchanged" means the
      # source repeated yesterday's file, so the site data would differ only in
      # its timestamps; "failed" has nothing to build from. Standard library
      # only, like the fetch: build_all.py skips build_districts.py, the one
      # script that needs pyshp.
      #
      # continue-on-error so the snapshot is still committed when the rebuild
      # breaks; the last step turns that into a failed run.
      - name: Rebuild site data
        id: rebuild
        if: steps.fetch.outputs.status == 'stored'
        continue-on-error: true
        env:
          SNAPSHOT_DATE: ${{ steps.fetch.outputs.date }}
        run: python scripts/build_all.py --date "${SNAPSHOT_DATE}"

      # A rebuild that stopped halfway leaves some pages on the new date and
      # some on the old one. Put public/data/ back so only the archive is
      # committed.
      - name: Discard a partial rebuild
        if: steps.rebuild.outcome == 'failure'
        run: |
          git restore --worktree -- public/data
          git clean -fdq -- public/data

      # always(): a failed fetch still writes a manifest row, and that row is
      # what distinguishes "source was unchanged" from "the fetch broke" when
      # stage 3 reconstructs labels from the snapshot series.
      - name: Commit and push
        id: push
        if: always() && steps.fetch.outputs.status != 'skipped'
        env:
          COMMIT_MESSAGE: ${{ steps.fetch.outputs.commit_message }}
          REBUILT: ${{ steps.rebuild.outcome == 'success' }}
        run: |
          set -euo pipefail
          if [ -z "${COMMIT_MESSAGE}" ]; then
            echo "no commit message produced, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if [ "${REBUILT}" = "true" ]; then
            git add public/data
            COMMIT_MESSAGE="${COMMIT_MESSAGE}, rebuild public/data"
          fi
          if git diff --cached --quiet; then
            echo "working tree clean, nothing to commit"
            exit 0
          fi
          git commit -m "${COMMIT_MESSAGE}"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed on attempt ${attempt}"
              echo "pushed=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "push attempt ${attempt} failed, retrying"
            sleep 10
          done
          echo "::error::could not push the snapshot after 3 attempts"
          exit 1

      # Deploy only from main, and only when new site data was pushed. The
      # Pages workflow checks out the branch head, which now includes the push.
      - name: Deploy the rebuilt site
        if: >-
          steps.rebuild.outcome == 'success'
          && steps.push.outputs.pushed == 'true'
          && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo "${GITHUB_REPOSITORY}" --ref main

      - name: Fail on a broken rebuild
        if: steps.rebuild.outcome == 'failure'
        run: |
          {
            echo "### Site data"
            echo ""
            echo "The snapshot was archived, but build_all.py failed, so"
            echo "public/data/ was left at the previous snapshot and the site"
            echo "was not redeployed. See the Rebuild site data step log."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::error::build_all.py failed; the snapshot was archived without a rebuild"
          exit 1

      # An unchanged day is normal; several in a row means the agency stopped
      # updating the feed, and the site would keep showing an old list with
      # nothing to flag it. Failing here is what sends the notification. Only
      # on unchanged days: a stored day resets the count, and a failed fetch
      # has already failed the run. Runs after the push so the manifest row it
      # counts is the one committed.
      - name: Check source freshness
        id: freshness
        if: always() && steps.fetch.outputs.status == 'unchanged'
        run: python scripts/check_freshness.py --days 3

      # The fetch step writes the run summary itself: it is what holds the row
      # count, the digest and the manifest, and a workflow step could only echo
      # back whatever was passed through GITHUB_OUTPUT. This catches the one
      # path that leaves no summary behind, an unexpected crash.
      - name: Note an unrecorded failure
        if: >-
          failure()
          && steps.rebuild.outcome != 'failure'
          && steps.freshness.outcome != 'failure'
        run: |
          echo "### Snapshot" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "The run failed before recording a result. See the step log." \
            >> "${GITHUB_STEP_SUMMARY}"
