<!DOCTYPE html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/stray-atlas/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StrayAtlas 浪浪地圖</title>
    <meta
      name="description"
      content="臺灣公立動物收容所開放資料的分析與互動視覺化：各縣市在所動物數與滯留天數。"
    />
    <script>
      // Stamp the saved theme before the first paint. Without this the page
      // renders in the OS scheme and flips once Vue mounts, which is a visible
      // flash for anyone whose choice differs from their system setting.
      try {
        var saved = localStorage.getItem('stray-atlas:theme')
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved)
        }
      } catch (e) {
        /* private window or blocked site data: fall through to the OS setting */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
